<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Motus Clone</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <!-- Game CSS -->
    <link rel="stylesheet" href="motus.css">
</head>
<body>

<div class="game-container">

    <!-- 7x7 Grid -->
    <div id="grid" class="grid"></div>

    <!-- Keyboard -->
    <div class="keyboard">
        <div class="row">
            <button>A</button><button>Z</button><button>E</button>
            <button>R</button><button>T</button><button>Y</button>
            <button>U</button><button>I</button><button>O</button><button>P</button>
        </div>
        <div class="row">
            <button>Q</button><button>S</button><button>D</button>
            <button>F</button><button>G</button><button>H</button>
            <button>J</button><button>K</button><button>L</button><button>M</button>
        </div>
        <div class="row">
            <button id="validate" class="enter">ENTRER</button>
            <button>W</button><button>X</button><button>C</button>
            <button>V</button><button>B</button><button>N</button>
            <button class="back">⌫</button>
        </div>
    </div>

</div>

<!-- Python game logic -->
<py-script src="motus.py"></py-script>

</body>
</html>
